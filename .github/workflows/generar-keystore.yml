name: Generar keystore

on:
  workflow_dispatch:

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar keystore de firma
        run: |
          keytool -genkeypair -v \
            -keystore app/biblia.jks \
            -alias biblia \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass biblia1234 -keypass biblia1234 \
            -dname "CN=Biblia Kuze, OU=Biblia, O=Kuze, L=Bogota, ST=Bogota, C=CO"
      - name: Subir keystore
        uses: actions/upload-artifact@v4
        with:
          name: biblia-keystore
          path: app/biblia.jks
