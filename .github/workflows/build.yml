name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and upload debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -u+x | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Install Android SDK platform and build tools
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Vosk Spanish model (voz flavor)
        run: |
          mkdir -p app/src/voz/assets
          curl -fL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q model.zip -d model_tmp
          mv model_tmp/vosk-model-small-es-0.42 app/src/voz/assets/model-es
          rm -rf model.zip model_tmp

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload normal APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: biblia-kuze-normal
          path: app/build/outputs/apk/normal/debug/app-normal-debug.apk
          if-no-files-found: error

      - name: Upload voice APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: biblia-kuze-voz
          path: app/build/outputs/apk/voz/debug/app-voz-debug.apk
          if-no-files-found: error
